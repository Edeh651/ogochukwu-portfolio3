<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ogochukwu — Copywriter & Content Strategist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #F9F7F3;
        font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button, a { font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif; }

      /* Fade-in animation */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .fade-up { animation: fadeUp 0.7s ease both; }
      .fade-up-2 { animation: fadeUp 0.7s 0.15s ease both; }
      .fade-up-3 { animation: fadeUp 0.7s 0.3s ease both; }
      .fade-up-4 { animation: fadeUp 0.7s 0.45s ease both; }

      /* Smooth hover on cards */
      .work-card:hover { transform: translateY(-3px); transition: transform 0.25s ease; }

      /* Mobile: ensure nothing overflows horizontally */
      section, div { max-width: 100%; }
    </style>
  </head>
  <body>
    <!-- FIX: React & Babel scripts MUST come BEFORE the babel script that uses React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useState, useEffect } = React;

      const NAV = ["About","Work","Results","Creatives","Reviews","Services","Contact"];

      const BRANDS = [
        { name: "Rungis Organics", init: "RO", color: "#2D6A4F", image: "ogo4.jpg" },
        { name: "Remih Skincare",  init: "RS", color: "#7B4F6A", image: "ogo3.jpg" },
        { name: "Sandos Bakeshop", init: "SB", color: "#C6602A", image: "ogo5.jpg" },
      ];

      const TESTIMONIALS = [
        {
          brand: "Rungis Organics", role: "Men's Wellness · Content Strategy", init: "RO", color: "#2D6A4F",
          text: "Ogochukwu completely transformed how we show up online. Our Instagram interactions went up 127% in under a month — that's not a coincidence. That's strategy.",
        },
        {
          brand: "Remih Skincare", role: "Skincare Brand · Campaign Content", init: "RS", color: "#7B4F6A",
          text: "The skincare routine campaign she created was exactly what we needed — real, personal, and educational. Our customers started tagging us after seeing it.",
        },
        {
          brand: "Rungis Organics", role: "Men's Wellness · Brand Voice", init: "RO", color: "#1B3A2D",
          text: "The copy didn't feel like marketing — it felt like a conversation. That's rare, and it's what makes her stand out from every other digital marketer I've worked with.",
        },
        {
          brand: "Remih Skincare", role: "Skincare Brand · Content Calendar", init: "RS", color: "#4A2D40",
          text: "She delivered a full 30-day content calendar we could actually execute — post briefs, image direction, captions included. Like having a full in-house creative team.",
        },
      ];

      const METRICS = [
        { num: "18.2K", lbl: "Single Reel Views",            badge: "Facebook Reel",  green: false },
        { num: "97%",   lbl: "Google Ads Conversions Growth", badge: "↑ Week-on-Week", green: true  },
        { num: "127%",  lbl: "Instagram Interactions",        badge: "↑ In 28 Days",   green: true  },
        { num: "100%",  lbl: "Instagram Views Growth",        badge: "↑ In 28 Days",   green: true  },
      ];

      // FIX: removed duplicate id:2
      const SOCIALS = [
        { id: 1, name: "LinkedIn",  url: "https://www.linkedin.com/in/edeh-ogochukwu-b75269215", icon: "in" },
        { id: 2, name: "Email",     url: "mailto:Ogochukwuprecious171@gmail.com",                 icon: "✉"  },
        { id: 3, name: "Instagram", url: "https://www.instagram.com/ogochukwuprecious171",        icon: "◎"  },
      ];

      const SERVICES = [
        { icon: "✍️", name: "Copywriting",           desc: "Social captions, carousel scripts, campaign copy — all written to feel human, not templated." },
        { icon: "📱", name: "Social Media Strategy", desc: "Platform-specific strategies with audience research, tone development & monthly calendars." },
        { icon: "🎯", name: "Brand Voice",            desc: "Defining a brand's unique tone of voice — then applying it consistently across every touchpoint." },
        { icon: "📊", name: "Analytics & Reporting", desc: "Performance tracking via Meta Business Suite, Google Analytics & Google Ads." },
        { icon: "🌍", name: "Multi-Market Content",  desc: "Culturally intelligent content for European and West African audiences simultaneously." },
        { icon: "📅", name: "Content Calendars",     desc: "Monthly calendars — ideated, structured, and delivered ready to hand to any creative team." },
      ];

      const ANALYTICS_CARDS = [
        { platform: "Facebook Reel Insights",          headline: "18,236 Views · 12,030 Reach · 570 Interactions · 1d 4h Watch Time", emoji: "📱" },
        { platform: "Google Ads — Campaign",           headline: "Conversions ↑97% · 23,500 Total Conversions · CPA $4.52",           emoji: "📈" },
        { platform: "Instagram Professional Dashboard",headline: "5,203 Views ↑100% · Engagement ↑100% · Net Followers ↑100%",        emoji: "📸" },
        { platform: "Facebook Insights",               headline: "40K Views · 991 Interactions · Follows ↑17.1% · Link Clicks ↑66.7%", emoji: "👍" },
        { platform: "Instagram Insights",              headline: "14.2K Views ↑47.5% · Interactions ↑127% · Follows ↑106%",           emoji: "💜" },
        { platform: "Facebook Insights",               headline: "27.2K Views · 1.4K Interactions · Link Clicks ↑23.8%",              emoji: "🔵" },
      ];

      // Design tokens
      const g       = "#C9A84C";   // gold
      const dark    = "#1A1714";
      const warm    = "#5C5852";
      const accent  = "#B05A26";
      const muted   = "#8A8480";
      const border  = "#E4DDD2";
      const offwhite= "#F9F7F3";
      const serif   = "'Cormorant Garamond', Georgia, serif";
      const sans    = "'DM Sans', 'Segoe UI', Arial, sans-serif";

      function Portfolio() {
        const [active,   setActive]   = useState("About");
        const [menuOpen, setMenuOpen] = useState(false);
        const [isMobile, setIsMobile] = useState(false);

        useEffect(() => {
          const check = () => setIsMobile(window.innerWidth < 768);
          check();
          window.addEventListener("resize", check);
          return () => window.removeEventListener("resize", check);
        }, []);

        const scrollTo = (id) => {
          document.getElementById(id.toLowerCase())?.scrollIntoView({ behavior: "smooth" });
          setMenuOpen(false);
          setActive(id);
        };

        // ── Shared micro-components ──────────────────────────────────────────
        const Card = ({ children, style = {} }) => (
          <div className="work-card" style={{
            background: "white", border: "1px solid " + border,
            borderRadius: 12, padding: isMobile ? "20px 18px" : 28,
            transition: "transform 0.25s ease, box-shadow 0.25s ease",
            ...style,
          }}>
            {children}
          </div>
        );

        const Tag = ({ children, color = accent, bg = "#FAF0E6" }) => (
          <span style={{
            display: "inline-block", background: bg, color,
            fontSize: 9.5, fontWeight: 700, letterSpacing: "0.12em",
            textTransform: "uppercase", padding: "5px 13px",
            borderRadius: 20, marginBottom: 14,
          }}>
            {children}
          </span>
        );

        const SectionLabel = ({ children, light = false }) => (
          <div style={{
            fontSize: 10, letterSpacing: "0.24em", textTransform: "uppercase",
            color: g, fontWeight: 700, marginBottom: 10,
            fontFamily: sans,
          }}>
            {children}
          </div>
        );

        const H2 = ({ children, light = false }) => (
          <h2 style={{
            fontFamily: serif, fontSize: "clamp(28px, 4.5vw, 42px)",
            fontWeight: 400, color: light ? offwhite : dark,
            marginBottom: 32, lineHeight: 1.1, marginTop: 0,
          }}>
            {children}
          </h2>
        );

        const Bullet = ({ children }) => (
          <div style={{
            display: "flex", gap: 10, fontSize: 13.5, color: warm,
            marginBottom: 8, lineHeight: 1.6,
          }}>
            <span style={{ color: g, flexShrink: 0, marginTop: 1 }}>→</span>
            <span>{children}</span>
          </div>
        );

        // ── NAV ──────────────────────────────────────────────────────────────
        return (
          <div style={{ fontFamily: sans, background: offwhite, color: dark, overflowX: "hidden", fontSize: 14 }}>

            <nav style={{
              position: "fixed", top: 0, left: 0, right: 0, zIndex: 1000,
              background: "rgba(22,19,16,0.97)", backdropFilter: "blur(14px)",
              height: 56, display: "flex", alignItems: "center",
              justifyContent: "space-between", padding: "0 5vw",
              borderBottom: "1px solid rgba(201,168,76,0.15)",
            }}>
              <div style={{ fontFamily: serif, fontSize: 20, fontWeight: 600, color: offwhite, letterSpacing: "0.02em" }}>
                Ogo<span style={{ color: g }}>chukwu</span>
              </div>

              {!isMobile ? (
                <div style={{ display: "flex", gap: 22, alignItems: "center" }}>
                  {NAV.slice(0, 6).map(l => (
                    <button key={l} onClick={() => scrollTo(l)} style={{
                      background: "none", border: "none", cursor: "pointer",
                      fontSize: 10.5, letterSpacing: "0.13em", textTransform: "uppercase",
                      color: active === l ? g : "#6E6A66",
                      fontWeight: active === l ? 600 : 400,
                      padding: "4px 0", borderBottom: active === l ? `1.5px solid ${g}` : "1.5px solid transparent",
                      transition: "color 0.2s",
                    }}>
                      {l}
                    </button>
                  ))}
                  <button onClick={() => scrollTo("Contact")} style={{
                    background: g, color: dark, border: "none", cursor: "pointer",
                    padding: "8px 20px", borderRadius: 4, fontSize: 10.5,
                    fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase",
                    marginLeft: 6,
                  }}>
                    Hire Me
                  </button>
                </div>
              ) : (
                <button onClick={() => setMenuOpen(!menuOpen)} style={{
                  background: "none", border: "none", cursor: "pointer",
                  color: g, fontSize: 22, lineHeight: 1, padding: "4px",
                }}>
                  {menuOpen ? "✕" : "☰"}
                </button>
              )}
            </nav>

            {/* Mobile dropdown menu */}
            {menuOpen && (
              <div style={{
                position: "fixed", top: 56, left: 0, right: 0, zIndex: 999,
                background: "rgba(22,19,16,0.99)", padding: "12px 5vw 20px",
                borderBottom: "1px solid rgba(201,168,76,0.18)",
              }}>
                {NAV.map(l => (
                  <button key={l} onClick={() => scrollTo(l)} style={{
                    display: "block", width: "100%", textAlign: "left",
                    background: "none", border: "none", cursor: "pointer",
                    padding: "13px 0", fontSize: 13, letterSpacing: "0.1em",
                    textTransform: "uppercase", color: "#ADA9A4",
                    borderBottom: "1px solid rgba(255,255,255,0.05)",
                  }}>
                    {l}
                  </button>
                ))}
                <button onClick={() => scrollTo("Contact")} style={{
                  marginTop: 14, width: "100%", background: g, color: dark,
                  border: "none", cursor: "pointer", padding: "12px 0",
                  borderRadius: 5, fontSize: 12, fontWeight: 700,
                  letterSpacing: "0.1em", textTransform: "uppercase",
                }}>
                  Hire Me
                </button>
              </div>
            )}

            {/* ── HERO ─────────────────────────────────────────────────────── */}
            <section id="about-hero" style={{
              minHeight: "100vh",
              background: "linear-gradient(160deg, #1A1714 0%, #0F0D0B 100%)",
              /* FIX: paddingTop accounts for fixed nav, rest of padding below */
              paddingTop: isMobile ? 72 : 80,
              paddingBottom: isMobile ? 56 : 80,
              paddingLeft: "6vw", paddingRight: "6vw",
              position: "relative", overflow: "hidden",
              display: "flex", alignItems: "center",
            }}>
              <div style={{
                position: "absolute", inset: 0,
                background: "radial-gradient(ellipse at 15% 70%, rgba(201,168,76,0.10) 0%, transparent 55%)",
                pointerEvents: "none",
              }} />
              {/* subtle grain overlay */}
              <div style={{
                position: "absolute", inset: 0, opacity: 0.03,
                backgroundImage: "url(\"data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E\")",
                backgroundSize: "200px 200px",
                pointerEvents: "none",
              }} />

              <div style={{
                maxWidth: 1160, margin: "0 auto", width: "100%",
                position: "relative", zIndex: 2,
                display: isMobile ? "flex" : "grid",
                flexDirection: isMobile ? "column" : undefined,
                gridTemplateColumns: isMobile ? undefined : "1fr 420px",
                gap: isMobile ? 40 : 56,
                alignItems: "center",
              }}>
                {/* Left text col */}
                <div className="fade-up">
                  <div style={{
                    display: "flex", alignItems: "center", gap: 10,
                    fontSize: 10, letterSpacing: "0.24em", textTransform: "uppercase",
                    color: g, fontWeight: 700, marginBottom: 22,
                  }}>
                    <div style={{ width: 32, height: 1.5, background: g, flexShrink: 0 }} />
                    Digital Marketing Portfolio
                  </div>

                  <h1 style={{
                    fontFamily: serif, fontSize: "clamp(56px, 9vw, 96px)",
                    fontWeight: 300, color: offwhite, lineHeight: 0.95,
                    marginBottom: 8, marginTop: 0,
                  }}>
                    Ogo<em style={{ fontStyle: "italic", color: g }}>chukwu</em>
                  </h1>

                  <div style={{
                    fontSize: 10.5, letterSpacing: "0.18em", textTransform: "uppercase",
                    color: "#6E6A66", marginBottom: 22, marginTop: 16,
                  }}>
                    Copywriter · Content Strategist · Social Media Director
                  </div>

                  <p style={{
                    fontSize: 15, lineHeight: 1.85, color: "#ADA9A4",
                    maxWidth: 500, marginBottom: 32, marginTop: 0,
                  }}>
                    I build brand worlds — not just content. From strategy to copy to
                    execution, I've helped skincare, wellness, and lifestyle brands across
                    Africa and Europe grow their audiences and deepen their impact.
                    Human-first. Data-informed. Built to last.
                  </p>

                  {/* Stats row — FIX: flex-wrap so it doesn't overflow on small screens */}
                  <div style={{
                    display: "flex", flexWrap: "wrap",
                    marginBottom: 32,
                    border: "1px solid rgba(201,168,76,0.2)",
                    borderRadius: 8, overflow: "hidden",
                    width: "fit-content", maxWidth: "100%",
                  }}>
                    {[["4+","Brands"],["54K+","Views/mo"],["127%","Growth"],["2","Continents"]].map(([n, l], idx, arr) => (
                      <div key={l} style={{
                        padding: isMobile ? "12px 16px" : "14px 22px",
                        borderRight: idx < arr.length - 1 ? "1px solid rgba(201,168,76,0.15)" : "none",
                        textAlign: "center",
                      }}>
                        <div style={{
                          fontFamily: serif, fontSize: isMobile ? 20 : 24,
                          fontWeight: 700, color: g, lineHeight: 1,
                        }}>
                          {n}
                        </div>
                        <div style={{
                          fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase",
                          color: "#504C48", marginTop: 4,
                        }}>
                          {l}
                        </div>
                      </div>
                    ))}
                  </div>

                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                    <button onClick={() => scrollTo("Work")} style={{
                      background: g, color: dark, border: "none", cursor: "pointer",
                      padding: isMobile ? "12px 22px" : "13px 30px",
                      borderRadius: 5, fontSize: 11, fontWeight: 700,
                      letterSpacing: "0.1em", textTransform: "uppercase",
                    }}>
                      View My Work
                    </button>
                    <button onClick={() => scrollTo("Contact")} style={{
                      background: "none", color: g,
                      border: "1px solid rgba(201,168,76,0.35)", cursor: "pointer",
                      padding: isMobile ? "12px 22px" : "13px 30px",
                      borderRadius: 5, fontSize: 11, fontWeight: 500,
                      letterSpacing: "0.1em", textTransform: "uppercase",
                    }}>
                      Get In Touch
                    </button>
                  </div>
                </div>

                {/* Right image col */}
                <div className="fade-up-2" style={{
                  display: "flex", justifyContent: isMobile ? "center" : "flex-end",
                  alignItems: "center",
                }}>
                  <div style={{
                    width: isMobile ? "min(300px, 80vw)" : "100%",
                    maxWidth: 420,
                    aspectRatio: "4 / 5",
                    borderRadius: 24,
                    overflow: "hidden",
                    boxShadow: "0 32px 80px rgba(0,0,0,0.45)",
                    border: "1px solid rgba(201,168,76,0.18)",
                    background: "rgba(255,255,255,0.05)",
                    position: "relative",
                  }}>
                    {/* gold accent bar */}
                    <div style={{
                      position: "absolute", bottom: 0, left: 0, right: 0,
                      height: 4, background: `linear-gradient(90deg, ${g}, transparent)`,
                      zIndex: 2,
                    }} />
                    <img src="ogopic.png" alt="Ogochukwu"
                      style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }}
                    />
                  </div>
                </div>
              </div>
            </section>

            {/* ── ABOUT ────────────────────────────────────────────────────── */}
            <section id="about" style={{ background: offwhite, padding: isMobile ? "64px 5vw" : "88px 6vw" }}>
              <div style={{
                maxWidth: 960, margin: "0 auto",
                display: isMobile ? "block" : "grid",
                gridTemplateColumns: "200px 1fr",
                gap: 56, alignItems: "start",
              }}>
                {/* Avatar column */}
                <div style={{ marginBottom: isMobile ? 36 : 0, textAlign: "center" }}>
                  {/* FIX: Proper circular image — removed broken fontSize:64 wrapper */}
                  <div style={{
                    width: isMobile ? 140 : 180,
                    height: isMobile ? 140 : 180,
                    borderRadius: "50%",
                    overflow: "hidden",
                    margin: "0 auto 14px",
                    border: `3px solid ${g}`,
                    boxShadow: "0 16px 48px rgba(0,0,0,0.14)",
                  }}>
                    <img src="ogopic.png" alt="Ogochukwu"
                      style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }}
                    />
                  </div>
                  <div style={{
                    background: g, color: dark, padding: "8px 14px",
                    borderRadius: 6, fontSize: 9.5, fontWeight: 700,
                    letterSpacing: "0.1em", textTransform: "uppercase",
                    display: "inline-block",
                  }}>
                    ✦ Available for Projects
                  </div>
                </div>

                {/* Text column */}
                <div>
                  <SectionLabel>About Me</SectionLabel>
                  <H2>
                    A strategist who{" "}
                    <em style={{ fontStyle: "italic", color: accent }}>writes</em>
                    {" "}— and a writer who{" "}
                    <em style={{ fontStyle: "italic", color: accent }}>thinks</em>
                  </H2>
                  <p style={{ fontSize: 15, lineHeight: 1.85, color: warm, marginBottom: 16, marginTop: 0 }}>
                    I'm a copywriter and digital marketing specialist with hands-on
                    experience building brand voices, driving audience engagement, and
                    managing content across platforms — from Instagram and TikTok to
                    Facebook, Threads, and Google My Business.
                  </p>
                  <p style={{ fontSize: 15, lineHeight: 1.85, color: warm, marginBottom: 28, marginTop: 0 }}>
                    My background in Archaeology & Tourism from the University of Nigeria,
                    Nsukka gives me a researcher's instinct: I study what moves people,
                    then craft messaging that converts attention into action. I've worked
                    across European and West African markets, bringing cultural
                    intelligence to every brief.
                  </p>

                  <div style={{
                    display: "grid",
                    gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr",
                    gap: 10,
                  }}>
                    {[
                      ["Education", "B.Sc. Archaeology & Tourism — UNN"],
                      ["Markets",   "Europe & West Africa"],
                      ["Tools",     "Meta Suite · Google Analytics · Google Ads"],
                      ["Platforms", "Instagram · TikTok · Facebook · Threads"],
                    ].map(([l, v]) => (
                      <div key={l} style={{
                        background: "white", border: "1px solid " + border,
                        borderLeft: "3px solid " + g,
                        borderRadius: 6, padding: "11px 14px",
                      }}>
                        <div style={{
                          fontSize: 9, letterSpacing: "0.14em", textTransform: "uppercase",
                          color: muted, marginBottom: 3,
                        }}>
                          {l}
                        </div>
                        <div style={{ fontSize: 13, color: dark, fontWeight: 500 }}>{v}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </section>

            {/* ── BRANDS STRIP ─────────────────────────────────────────────── */}
            <div style={{ background: dark, padding: "44px 6vw" }}>
              <div style={{
                textAlign: "center", fontSize: 10, letterSpacing: "0.22em",
                textTransform: "uppercase", color: "rgba(255,255,255,0.4)",
                marginBottom: 28, fontWeight: 500,
              }}>
                Brands I've Worked With
              </div>
              <div style={{
                display: "flex", justifyContent: "center",
                gap: isMobile ? 24 : 44, flexWrap: "wrap",
              }}>
                {BRANDS.map(b => (
                  <div key={b.name} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
                    <div style={{
                      width: 64, height: 64, borderRadius: "50%",
                      background: b.color, overflow: "hidden",
                      border: "2px solid rgba(201,168,76,0.3)",
                    }}>
                      <img src={b.image} alt={b.name}
                        style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }}
                      />
                    </div>
                    <span style={{
                      fontSize: 9.5, letterSpacing: "0.1em", textTransform: "uppercase",
                      color: "rgba(255,255,255,0.55)", textAlign: "center",
                    }}>
                      {b.name}
                    </span>
                  </div>
                ))}
              </div>
            </div>

            {/* ── WORK ─────────────────────────────────────────────────────── */}
            <section id="work" style={{ padding: isMobile ? "64px 5vw" : "88px 6vw", background: offwhite }}>
              <div style={{ maxWidth: 960, margin: "0 auto" }}>
                <SectionLabel>Selected Work</SectionLabel>
                <H2>
                  Campaigns &{" "}
                  <em style={{ fontStyle: "italic", color: accent }}>Content</em>
                </H2>

                {/* Work card 1 */}
                <Card style={{ marginBottom: 28, borderLeft: "4px solid " + g }}>
                  <Tag>Skincare · Campaign Content · Carousel Copy</Tag>
                  <h3 style={{
                    fontFamily: serif, fontSize: 22, fontWeight: 600,
                    color: dark, marginBottom: 16, marginTop: 0,
                  }}>
                    Remih Skincare — Brand Strategy
                  </h3>

                  {/* FIX: Broken wall-of-text split into labelled paragraphs */}
                  <div style={{ fontSize: 14, lineHeight: 1.85, color: warm }}>
                    <p style={{ marginTop: 0, marginBottom: 12 }}>
                      <strong style={{ color: dark, fontWeight: 600 }}>The Challenge</strong><br />
                      Remih Skincare had a visibility and sales problem. Before the strategy
                      overhaul, posts were generating an average of around 15 comments — modest
                      engagement for a brand posting daily, and a signal that content was not
                      connecting with its audience.
                    </p>
